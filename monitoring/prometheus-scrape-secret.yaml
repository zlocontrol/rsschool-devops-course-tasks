
apiVersion: v1
kind: Secret
metadata:
  name: additional-scrape-configs
  namespace: monitoring
type: Opaque
stringData:
  prometheus-additional.yaml: |
    - job_name: 'flask-app'
      metrics_path: /metrics
      static_configs:
        - targets:
            - flask-app-release.jenkins.svc.cluster.local:8080

