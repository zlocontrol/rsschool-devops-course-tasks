
alertmanager:
  enabled: true
  service:
    type: NodePort
    port: 9093
    nodePort: 30093

server:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30090"

  extraScrapeConfigs:
    - job_name: 'flask-app'
      metrics_path: /metrics
      static_configs:
        - targets:
            - flask-app-release.jenkins.svc.cluster.local:8080

    - job_name: 'kube-state-metrics'
      metrics_path: /metrics
      static_configs:
        - targets:
            - kube-state-metrics.monitoring.svc.cluster.local:8080

    - job_name: 'node-exporter'
      metrics_path: /metrics
      static_configs:
        - targets:
            - node-exporter.monitoring.svc.cluster.local:9100



  extraAlertmanagerConfig: |
    route:
      receiver: 'email-receiver'
      group_by: ['alertname', 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    receivers:
      - name: 'email-receiver'
        email_configs:
          - to: 'cantaktget@gmail.com' 
            from: 'cantaktget@gmail.com' 
            smarthost: 'smtp.example.com:465' 
            auth_username: 'cantaktget@gmail.com' 
            auth_password: 'password' 
            require_tls: true
            tls_config:
              insecure_skip_verify: true







